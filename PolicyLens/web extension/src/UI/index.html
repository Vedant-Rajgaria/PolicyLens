<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PolicyLens</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <div class="logo">🛡️</div>

            <div>
                <h1>PolicyLens</h1>
            </div>
        </header>


        <!-- CURRENT PAGE -->

        <div class="page-info">

            <span class="label">
                CURRENT PAGE
            </span>

            <div id="page-name">
                Loading page info...
            </div>

        </div>


        <!-- ANALYZE BUTTON -->

        <button id="analyze-btn">
            Analyze with PolicyLens
        </button>


        <!-- RESULTS -->

        <div id="results" class="hidden">

            <h2>
                Policy Summary
            </h2>

            <!-- JavaScript will create cards here -->

            <div id="cards-container"></div>


            <!-- WARNINGS -->

            <div class="warning">

                <h3>
                    ⚠️ Things you should know
                </h3>

                <ul id="warning-list"></ul>

            </div>

        </div>

    </div>


    <script src="popup.js"></script>

</body>

</html>
