<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolicyLens</title>
    <!-- Award-Winning Typography: Outfit (Headings) + Plus Jakarta Sans (Body & UI) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="widget-outer-container">

        <!-- DECORATIVE BRAND RIBBONS (Animated Corner Ribbons) -->
        <div class="decorative-ribbon ribbon-blue"></div>
        <div class="decorative-ribbon ribbon-red"></div>
        <div class="decorative-ribbon ribbon-green"></div>
        <div class="decorative-ribbon ribbon-yellow"></div>

        <!-- MAIN CARD CONTAINER (Figma: Popup #e2ecfe, 380px, radius 24px) -->
        <div class="policylens-card" id="policylens-card">

            <!-- AESTHETIC INFO TOAST (Clean Note - Star emoji removed) -->
            <div class="info-toast hidden" id="info-toast">
                <div class="info-toast-content">
                    <div class="info-toast-header">
                        <span class="info-toast-title">PolicyLens Note</span>
                        <button class="info-toast-close" id="info-toast-close" type="button" aria-label="Close Note">&times;</button>
                    </div>
                    <p class="info-toast-msg">This button is for aesthetic purposes only.</p>
                    <p class="info-toast-credits">Designed by <strong>Vedant &amp; Darsh</strong>.</p>
                </div>
            </div>

            <!-- HEADER (Figma: PolicyLens Heading + Interactive Window Control Dots) -->
            <header class="card-header">
                <div class="header-titles">
                    <h1 class="card-title">PolicyLens</h1>
                    <p class="card-subtitle">Know what you're agreeing to.</p>
                </div>

                <div class="window-controls">
                    <button class="dot dot-close" id="dot-close" title="Close Window" type="button"></button>
                    <button class="dot dot-minimize" id="dot-minimize" title="Minimize Window" type="button"></button>
                    <button class="dot dot-expand" id="dot-info" title="Aesthetic Info" type="button"></button>
                </div>
            </header>

            <!-- CURRENT PAGE INFO BOX (Clean box - Pill badge removed) -->
            <div class="page-info">
                <div class="page-info-header">
                    <span class="label">CURRENT PAGE</span>
                    <div id="site-badge" style="display: none !important;"></div>
                </div>

                <div id="page-name" class="page-name-text">
                    Loading page info...
                </div>
            </div>

            <!-- ANALYZE BUTTON (Figma: Analyze Interactive #2563eb, radius 9px, 13.6px bold) -->
            <button id="analyze-btn" class="primary-btn" type="button">
                Analyze with PolicyLens
            </button>

            <!-- STATUS (Figma: Ready to analyze this page) -->
            <div id="status" class="status-text">
                Ready to analyze this page.
            </div>

            <!-- RESULTS SECTION (Figma: Expanded Popup Policy Summary) -->
            <div id="results" class="results-container hidden">

                <!-- POLICY SUMMARY HEADING (Figma: Policy Summary 21.8px bold) -->
                <h2 class="results-heading">
                    Policy Summary
                </h2>

                <div id="summary-line" class="summary-line">
                </div>

                <!-- DYNAMIC POLICY CARDS (Figma: body #e3ecff, radius 10px, padding 12px 14px) -->
                <div id="cards-container" class="cards-container">
                </div>

                <!-- IMPORTANT INFORMATION / WARNINGS -->
                <div class="warning">
                    <h3 class="warning-title">
                        ⚠️ Things you should know
                    </h3>
                    <ul id="warning-list" class="warning-list">
                    </ul>
                </div>

                <!-- RELEVANT POLICY LINKS -->
                <div class="links-section">
                    <h3 class="links-title">
                        🔗 Relevant Policy Links
                    </h3>
                    <div id="links-container" class="links-container">
                    </div>
                </div>

                <!-- EXTRACTION DETAILS (DEBUG) -->
                <details class="debug-section">
                    <summary class="debug-summary">
                        Extraction Details
                    </summary>
                    <div id="stats" class="stats-box">
                    </div>
                    <pre id="raw-output" class="raw-output-box"></pre>
                </details>

            </div>

        </div>

    </div>

    <!-- POPUP JAVASCRIPT (Interactive Functionality) -->
    <script src="popup.js"></script>

</body>

</html>
